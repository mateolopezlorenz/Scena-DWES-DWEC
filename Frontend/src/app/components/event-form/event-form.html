<div class="container">
  <h1>Crear Evento</h1>
  <form (ngSubmit)="onSubmit()"#eventForm="ngForm" class="form">
    <label for="name">Nombre del Evento:</label>
    <input type="text" id="name" name="name" [(ngModel)]="eventData.name" required>
    <br>

    <label for="description">Descripción:</label>
    <input type="text" id="description" name="description" [(ngModel)]="eventData.description" required>
    <br>

    <label for="category">Categoría:</label>
    <select id="category" name="category" [(ngModel)]="eventData.category" required>
      <option value="">Selecciona una categoría</option>
      <option value="TRAP">Trap</option>
      <option value="REGGAETON">Reggaeton</option>
      <option value="TECHNO">Techno</option>
      <option value="ROCK">Rock</option>
      <option value="FLAMENCO">Flamenco</option>
    </select>
    <br>

    <label for="startDate">Fecha de inicio :</label>
    <input type="datetime-local" id="startDate" name="startDate" [(ngModel)]="eventData.startDate" required>
    <br>

    <label for="endDate">Fecha de fin:</label>
    <input type="datetime-local" id="endDate" name="endDate" [(ngModel)]="eventData.endDate" required>
    <div *ngIf="eventData.startDate && eventData.endDate && eventData.endDate < eventData.startDate" style="color:red;font-size:0.85em;">
      La fecha de fin debe ser posterior a la fecha de inicio.
    </div>
    <br>

    <label for="latitude">Latitud:</label>
    <input type="number" id="latitude" name="latitude" [(ngModel)]="eventData.latitude" min="-90" max="90" step="0.0001" required>
    <br>

    <label for="longitude">Longitud:</label>
    <input type="number" id="longitude" name="longitude" [(ngModel)]="eventData.longitude" min="-180" max="180" step="0.0001" required>
    <br>

    <button type="button" (click)="showMapSelector = !showMapSelector" style="margin: 10px 0;">
      {{ showMapSelector ? 'Ocultar Mapa' : 'Seleccionar en Mapa' }}
    </button>
    <br>

    <div *ngIf="showMapSelector" style="width:100%;height:400px;margin:15px 0;border:1px solid #ccc;">
      <app-map-view (coordinatesSelected)="onCoordinatesSelected($event)"></app-map-view>
    </div>
    <br>

    <label for="address">Dirección:</label>
    <input type="text" id="address" name="address" [(ngModel)]="eventData.address" required>
    <br>

    <button type="submit" [disabled]="!eventForm.form.valid || (eventData.startDate && eventData.endDate && eventData.endDate < eventData.startDate)">Crear Evento</button>
  </form>


</div>
