<div class="event-detail" *ngIf="event">
  <h2>{{ event.name }}</h2>

  <p><strong>Descripción:</strong> {{ event.description }}</p>
  <p><strong>Categoría:</strong> {{ event.category }}</p>
  <p><strong>Fecha Inicio:</strong> {{ event.startDate }}</p>
  <p><strong>Fecha Fin:</strong> {{ event.endDate }}</p>
  <p><strong>Capacidad:</strong> {{ event.capacity }}</p>
  <p><strong>Salas:</strong> {{ event.rooms }}</p>
  <p><strong>Local ID:</strong> {{ event.localId }}</p>
  <p><strong>Usuario ID:</strong> {{ event.userId }}</p>
</div>

<div *ngIf="!event" class="no-event">
  <p>Cargando evento</p>
</div>
