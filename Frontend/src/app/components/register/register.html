<div class="container">
    <h1>Registro de usuarios.</h1>

    <form (ngSubmit)="onSubmit()" #registerForm="ngForm" class="form">
        <label for="username">Nombre de usuario:</label>
        <input type="text" id="username" name="username" [(ngModel)]="registerData.username" #usernameField="ngModel" required minlength="3">
        <div *ngIf="usernameField.invalid && usernameField.touched" class="error-msg">
            <span *ngIf="usernameField.errors?.['required']">El nombre de usuario es obligatorio.</span>
            <span *ngIf="usernameField.errors?.['minlength']">Mínimo 3 caracteres.</span>
        </div>
        <br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="example@example.com" [(ngModel)]="registerData.email" #emailField="ngModel" required email>
        <div *ngIf="emailField.invalid && emailField.touched" class="error-msg">
            <span *ngIf="emailField.errors?.['required']">El email es obligatorio.</span>
            <span *ngIf="emailField.errors?.['email']">Introduce un email válido.</span>
        </div>
        <br>

        <label for="password">Contraseña:</label>
        <input type="password" id="password" name="password" [(ngModel)]="registerData.password" #passwordField="ngModel" required minlength="6">
        <div *ngIf="passwordField.invalid && passwordField.touched" class="error-msg">
            <span *ngIf="passwordField.errors?.['required']">La contraseña es obligatoria.</span>
            <span *ngIf="passwordField.errors?.['minlength']">Mínimo 6 caracteres.</span>
        </div>
        <br>

        <label for="password2">Confirmar Contraseña:</label>
        <input type="password" id="password2" name="password2" [(ngModel)]="registerData.password2" #password2Field="ngModel" required>
        <div *ngIf="password2Field.touched && registerData.password !== registerData.password2" class="error-msg">
            <span>Las contraseñas no coinciden.</span>
        </div>
        <br>

        <button type="submit" [disabled]="!registerForm.valid || registerData.password !== registerData.password2">Registrar</button>
    </form>
    <p>¿Ya tienes contraseña? <a routerLink="/login">Iniciar sesión</a></p>
</div>
