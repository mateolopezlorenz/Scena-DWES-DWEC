<div class="container-fluid p-0">

    <h1>Login de usuarios</h1>

    <form (ngSubmit)="onSubmit()" #loginForm="ngForm" class="form">
        <label for="email">Correo electrónico:</label>
        <input type="email" name="email" id="email" [(ngModel)]="loginData.email" required>


        <label for="password">Contraseña:</label>
        <input type="password" name="password" id="password" [(ngModel)]="loginData.password" required>


        <button type="submit" [disabled]="!loginForm.valid">Iniciar sesión</button>
    </form>
    <p>¿No tienes cuenta?<a routerLink="/register">Crear cuenta.</a></p>

</div>
